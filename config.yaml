# Shared settings for preprocessing, training, evaluation, and prediction.
random_seed: 42

# Dataset columns and input location.
data_path: data/raw/creditcard.csv
target_column: Class

# Fractions of the full dataset. The remaining rows are used for training.
test_size: 0.2
validation_size: 0.1

# Training settings.
batch_size: 2048
learning_rate: 0.001
epochs: 20
hidden_dims: [64, 32]
dropout: 0.2
classification_threshold: 0.5
